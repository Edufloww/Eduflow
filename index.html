<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduFlow</title>
  <link rel="manifest" href="/Eduflow/manifest.json">
<meta name="theme-color" content="#0c3b99">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EduFlow">  

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <style>
    /* Google Fonts - Poppins */
    @import url('https://fonts.googleapis.com/css2?family=Miniver&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    :root {
      --white-color: #FFFFFF;
      --dark-color: #000000;
      --primary-color: #106cc2;
      --secondary-color: #1153cf;
      --background-color: #0c3b99;
      --nav-height: 60px;

      /* Font size */
      --font-size-s: 0.9rem;
      --font-size-n: 1rem;
      --font-size-m: 1.12rem;
      --font-size-l: 1.5rem;
      --font-size-xl: 2rem;
      --font-size-xxl: 2.3rem;

      /* Font weight */
      --font-weight-normal: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;

      /* Border radius */
      --border-radius-s: 8px;
      --border-radius-m: 30px;
      --border-radius-circle: 50%;

      /* Site max width */
      --site-max-width: 1300px;
    }

    /* Stylings for whole site */
    ul {
      list-style: none;
    }

    a {
      text-decoration: none;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Navbar stylings */
    header {
      position: fixed;
      width: 100%;
      z-index: 5;
      background: var(--background-color);
    }

    header .navbar {
      display: flex;
      align-items: center;
      padding: 20px;
      justify-content: space-between;
    }

    .section-content {
      max-width: var(--site-max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    .navbar .nav-menu {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .navbar .nav-menu .nav-item .nav-link {
      display: flex;
      gap: 10px;
      padding: 10px 18px;
      color: var(--white-color);
      background: var(--secondary-color);
      font-size: var(--font-size-m);
      border-radius: var(--border-radius-m);
      transition: 0.3s ease;
    }

    .navbar .nav-menu .nav-item .nav-link:hover {
      color: var(--primary-color);
      background: var(--secondary-color);
    }

    .navbar .nav-logo .logo-text {
      color: var(--white-color);
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
    }

    /* Hide the hamburger by default */
    .menu-toggle {
      display: none;
      font-size: 28px;
      color: var(--white-color);
      cursor: pointer;
    }

    /* Hero Section */
    .hero-section {
      background: var(--primary-color);
      min-height: 100vh;
    }

    .hero-section .section-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      color: var(--white-color);
      padding-top: 80px;
    }

    .hero-section .hero-details .title {
      font-size: var(--font-size-xxl);
      color: var(--white-color);
      font-family: Poppins, sans-serif;
    }

    .hero-section .hero-details .subtitle {
      margin-top: 10px;
      font-size: var(--font-size-l);
      color: var(--white-color);
    }

    .hero-section .hero-details .description {
      margin: 20px 0;
      font-size: var(--font-size-m);
      color: var(--white-color);
    }

    .hero-section .hero-details .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .hero-section .hero-details .buttons a {
      display: block;
      text-align: center;
      padding: 12px 24px;
      border: 2px solid transparent;
      color: var(--white-color);
      border-radius: var(--border-radius-m);
      background: var(--secondary-color);
      font-weight: var(--font-weight-medium);
      font-size: var(--font-size-m);
      transition: 0.3s ease;
    }

    .hero-section .hero-details .buttons a:hover {
      background: rgb(21, 152, 196);
      border: 2px solid var(--white-color);
      color: var(--white-color);
    }

    .hero-section .hero-image-wrapper {
      max-width: 500px;
      margin-right: 30px;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-left: 80px;
    }

    .hero-section .hero-image {
      width: 200%;
      max-width: 500px;
      height: auto;
    }

    /* Responsive (mobile) */
    @media (max-width: 768px) {
      .navbar .nav-menu {
        position: absolute;
        top: var(--nav-height);
        right: 0;
        flex-direction: column;
        background: var(--background-color);
        width: 200px;
        padding: 20px;
        gap: 15px;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      .navbar .nav-menu.active {
        transform: translateX(0);
      }

      .menu-toggle {
        display: block;
      }
    }

    @media (max-width: 500px) {
      header .navbar {
        flex-direction: column;
        align-items: flex-start;
        padding: 12px 8px;
      }

      .navbar .nav-logo .logo-text {
        font-size: 1.3rem;
      }

      .menu-toggle {
        font-size: 32px;
        margin-left: 6px;
      }

      .navbar .nav-menu {
        width: 100vw;
        right: 0;
        padding: 16px 8px;
      }

      .navbar .nav-menu .nav-item .nav-link {
        font-size: 1rem;
        padding: 10px 10px;
      }

      .hero-section .section-content {
        flex-direction: column;
        min-height: auto;
        padding: 0;
      }

      .hero-section .hero-details {
        width: 100%;
        margin: 0;
        padding: 0 8px;
        text-align: center;
      }

      .hero-section .title {
        font-size: 1.5rem;
      }

      .hero-section .subtitle {
        font-size: 1.1rem;
      }

      .hero-section .hero-details .buttons a {
        font-size: 1rem;
        padding: 10px 0;
        margin: 0;
      }

      .hero-section .hero-image-wrapper {
        margin: 20px 0 0 0;
        max-width: 90vw;
        margin-left: 0;
      }

      .hero-section .hero-image {
        width: 100%;
        max-width: 320px;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar section-content">
      <a href="#" class="nav-logo">
        <h2 class="logo-text">EduFlow</h2>
      </a>
      <button class="menu-toggle" id="menu-toggle">&#9776;</button>
    </nav>
  </header>

  <main>
    <section class="hero-section">
      <div class="section-content">
        <!-- Text -->
        <div class="hero-details">
          <h2 class="title">Dein Plan, dein Flow</h2>
          <h3 class="subtitle">Mache Notizen, behalte den Überblick auf deine Prüfungen, lerne mit Karteikarten</h3>
          <p class="description">Lass uns loslegen</p>
          <div class="buttons">
            <a href="#" class="button-Notizen" onclick="window.location.href='meine-notizen.html'">Notizen</a>
            <a href="#" class="button-termine" onclick="window.location.href='pruefungen.html'">Termine</a>
            <a href="#" class="button-Kalender" onclick="window.location.href='kalender.html'">Kalender</a>
            <a href="#" class="button-Mindmaps" onclick="window.location.href='mindmaps.html'">Mindmaps</a>
            <a href="#" class="button-Karteikarten" onclick="window.location.href='karteien.html'">Karteikarten</a>
            <a href="#" class="button-ToDo-Liste" onclick="window.location.href='todos.html'">ToDo-Liste</a>
            <a href="#" class="Tagebuch" onclick="window.location.href='tagebuch.html'">Tagebuch</a>
            <a href="#" class="Rechner" onclick="window.location.href='timer.html'">Rechner</a>
          </div>
        </div>

        <!-- Bild -->
        <div class="hero-image-wrapper">
          <img src="Startbild_Eduflow-2.png" class="hero-image" alt="Hero">
        </div>
      </div>
    </section>
  </main>

  <script src="auth-protect.js"></script>

  <script>
    // Hamburger Menu Toggle
    const menuToggle = document.getElementById('menu-toggle');
    const navMenu = document.querySelector('.nav-menu');

    menuToggle.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });

    // Logout Funktion
    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "login-page.html";
      }).catch((error) => {
        console.error("Fehler beim Logout:", error);
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/Eduflow/service-worker.js')
          .then(reg => console.log('✓ Service Worker registriert'))
          .catch(err => console.log('✗ Fehler:', err));
      });
    }
  </script>

</body>
</html>
